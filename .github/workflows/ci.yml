name: CI

on:
  push:
    branches: [ "**" ]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Determine Python matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          echo 'matrix={"python-version":["3.10","3.11"]}' >> $GITHUB_OUTPUT

  lint-test:
    name: Lint • Type-check • Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # project deps
          pip install -e .
          # dev/test tools (keep explicit for reproducibility)
          pip install pytest pytest-cov ruff mypy build yfinance pandas plotly python-dotenv

      - name: Ruff (lint)
        run: |
          ruff check --output-format=github .

      - name: Mypy (type-check)
        run: |
          mypy --ignore-missing-imports --install-types --non-interactive src || true

      - name: Unit tests
        env:
          # Keep yfinance quiet & deterministic
          PYTHONWARNINGS: "ignore"
        run: |
          pytest -q --maxfail=1 --disable-warnings --cov=src --cov-report=xml

      - name: Build package (sdist+wheel)
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qts-dist-py${{ matrix.python-version }}
          path: dist/*

  smoke-import:
    name: Import smoke-test (qts package)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install yfinance pandas python-dotenv
      - name: Import key modules
        run: |
          python - <<'PY'
          import importlib
          import qts
          for m in ("qts.data.prices","qts.analysis.indicators"):
              importlib.import_module(m)
          print("OK: imports succeeded")
          PY
