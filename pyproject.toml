[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qts"
version = "0.1.0"
description = "Quant Trading System utilities"
requires-python = ">=3.10"
dependencies = [
  # existing...
  "requests>=2.32",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "vaderSentiment>=3.3.2",  # lightweight sentiment
  "tenacity>=9.0",          # polite retries
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["qts"]
