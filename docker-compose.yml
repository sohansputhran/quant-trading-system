version: "3.9"

services:
  qts:
    build:
      context: .
      dockerfile: Dockerfile
    image: qts:dev
    container_name: qts
    # If you have a local .env, this will inject it (create one from .env.example)
    env_file:
      - .env
    # Mount source for fast iteration (optional; remove in prod)
    volumes:
      - ./:/app
    working_dir: /app
    # Choose one of the commands below as-needed
    command: bash
    # Uncomment to run Jupyter Lab by default
    # command: >
    #   bash -lc "pip install jupyterlab && jupyter lab
    #   --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token=''"
    ports:
      - "8888:8888"   # Jupyter Lab (optional)
      - "8501:8501"   # Streamlit 
    tty: true
